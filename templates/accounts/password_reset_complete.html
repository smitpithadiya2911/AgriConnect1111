{% extends 'base.html' %}

{% block title %}Password Reset Complete – AgriConnect{% endblock %}

{% block content %}
<div class="container py-5 animate-fade">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 rounded-4 shadow-sm bg-white p-4 p-md-5 text-center">
                <div class="bg-success-subtle text-success rounded-circle p-3 d-inline-flex align-items-center justify-content-center mx-auto mb-3" style="width: 64px; height: 64px;">
                    <i class="fa-solid fa-circle-check fs-2"></i>
                </div>
                <h3 class="fw-bold text-success mb-2">Password Reset Complete</h3>
                <p class="text-muted small mb-4">Your password has been set. You may now proceed to log in with your new password.</p>
                <a href="{% url 'login' %}" class="btn btn-success fw-bold rounded-3 py-2 px-4">
                    <i class="fa-solid fa-sign-in me-2"></i>Sign In Now
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
